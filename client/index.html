<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova SBE kart racer</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <h1>Nova SBE kart racer</h1>

      <!-- The numbers above the track. main.js fills them in. -->
      <div class="hud">
        <span>Lap <strong id="lap">1</strong> of <strong id="laps">3</strong></span>
        <span>Time <strong id="time">0:00.00</strong></span>
        <span>Camera <strong id="view"></strong></span>
        <span id="lap-times" class="lap-times"></span>
      </div>

      <!-- The track is drawn on the canvas. The message sits on top of it. -->
      <div class="screen">
        <canvas id="track" width="960" height="576">Your browser cannot show the game.</canvas>
        <p id="message" class="message" role="status"></p>
      </div>

      <p class="help">
        Arrow keys: <kbd>↑</kbd> gas, <kbd>↓</kbd> brake and reverse, <kbd>←</kbd> <kbd>→</kbd> steer.
        <kbd>R</kbd> starts again. <kbd>V</kbd> changes the camera. Drive clockwise.
      </p>
      <p class="note">Practice on the test track. This race runs in your browser and is not saved.</p>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
