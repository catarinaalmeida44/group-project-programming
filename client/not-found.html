<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova SBE kart racer: page not found</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <!-- The server sends this page, with the number 404 ("not found"), when
         someone opens an address that does not exist (server/app.js). It
         needs no code of its own: it is words and a way back to the menu. -->
    <main class="lost-page">
      <h1>Nova SBE kart racer</h1>
      <div class="link-card">
        <h2 class="link-title">Off the track</h2>
        <p class="link-text">There is no page at this address. Every race starts from the menu.</p>
        <!-- The little kart of the "waking up" card, standing at the start of its road. Only decoration. -->
        <div class="wake-road" aria-hidden="true"><span class="wake-kart"></span></div>
        <div class="link-actions">
          <a class="button button-primary" href="/">Back to the menu</a>
        </div>
      </div>
    </main>
  </body>
</html>
