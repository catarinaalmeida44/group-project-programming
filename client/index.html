<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nova SBE kart racer</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <!-- The main menu: the first page a player sees. -->
    <main class="menu">
      <button type="button" id="open-settings" class="settings-button">⚙ Settings</button>

      <h1>Nova SBE kart racer</h1>
      <p class="tagline">Kart racing on the Carcavelos campus</p>

      <nav class="menu-choices" aria-label="Main menu">
        <a class="menu-choice" href="/race.html">Single race</a>
        <button type="button" class="menu-choice" disabled aria-describedby="cup-soon">Cup</button>
        <p id="cup-soon" class="menu-soon">Cup: coming soon, with three campus tracks</p>
        <a class="menu-choice" href="/online.html">Online</a>
        <button type="button" id="open-leaderboard" class="menu-choice">Leaderboard</button>
      </nav>
    </main>

    <script type="module" src="/menu.js"></script>
